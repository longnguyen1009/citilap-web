<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="sv-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="sv-wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="sv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4338CA" flood-opacity="0.15"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="108" rx="58" ry="7" fill="#CBD5E1" opacity="0.6"/>

  <g filter="url(#sv-shadow)">
    <!-- Screen Lid -->
    <rect x="36" y="24" width="88" height="56" rx="4" fill="#1E293B"/>
    <rect x="40" y="28" width="80" height="48" rx="2" fill="url(#sv-screen)"/>
    <!-- Vibrant Dynamic Student Logo on Screen -->
    <path d="M60,62 C68,42 74,40 82,50 C90,60 96,44 102,48" stroke="url(#sv-wave)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="40" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Floating Graduation Cap / Book Icon -->
  <g transform="translate(118, 16)" filter="url(#sv-shadow)">
    <polygon points="12,2 24,7 12,12 0,7" fill="#4F46E5"/>
    <path d="M5,10.5 L5,16 C5,19 12,21 12,21 C12,21 19,19 19,16 L19,10.5" fill="#4338CA"/>
    <path d="M22,8 L24,14 L22,14" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Laptop Base -->
  <polygon points="18,102 142,102 130,80 30,80" fill="#E2E8F0"/>
  <polygon points="34,83 126,83 122,96 38,96" fill="#94A3B8" opacity="0.4"/>
  <rect x="68" y="98" width="24" height="2.5" rx="1" fill="#64748B"/>
</svg>
