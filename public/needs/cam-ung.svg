<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="cu-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="cu-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="108" rx="56" ry="6" fill="#CBD5E1" opacity="0.6"/>

  <!-- Screen Lid with Touch ripples -->
  <g>
    <rect x="36" y="24" width="88" height="56" rx="4" fill="#0F172A"/>
    <rect x="40" y="28" width="80" height="48" rx="2" fill="url(#cu-screen)"/>
    <!-- Touch ripples on screen -->
    <circle cx="78" cy="50" r="14" fill="none" stroke="#BAE6FD" stroke-width="1.2" opacity="0.5"/>
    <circle cx="78" cy="50" r="8" fill="none" stroke="#E0F2FE" stroke-width="1.5" opacity="0.8"/>
    <circle cx="78" cy="50" r="3" fill="#FFFFFF" filter="url(#cu-glow)"/>
  </g>

  <!-- Laptop Base -->
  <polygon points="18,102 142,102 130,80 30,80" fill="#334155"/>
  <polygon points="34,83 126,83 122,96 38,96" fill="#1E293B"/>

  <!-- Digital Stylus Pen leaning on right -->
  <g transform="translate(118, 38) rotate(32)">
    <polygon points="0,0 4,-6 8,0 8,46 0,46" fill="#F8FAFC"/>
    <polygon points="2,-6 4,-10 6,-6" fill="#0284C7"/>
    <rect x="0" y="8" width="8" height="12" fill="#E2E8F0"/>
    <rect x="0" y="36" width="8" height="6" fill="#94A3B8"/>
    <line x1="4" y1="-10" x2="4" y2="46" stroke="#CBD5E1" stroke-width="0.5"/>
  </g>
</svg>
