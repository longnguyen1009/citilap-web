<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="ai-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ai-npu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="ai-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.7"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="108" rx="60" ry="7" fill="#818CF8" opacity="0.3"/>

  <!-- Screen Lid -->
  <g>
    <rect x="36" y="24" width="88" height="56" rx="4" fill="#090D16"/>
    <rect x="40" y="28" width="80" height="48" rx="2" fill="url(#ai-screen)"/>
    
    <!-- Glowing AI Chip / Neural Nexus Graphic on Screen -->
    <g transform="translate(68, 38)" filter="url(#ai-glow)">
      <!-- Hexagon / Circuit Core -->
      <polygon points="12,0 24,7 24,21 12,28 0,21 0,7" fill="none" stroke="url(#ai-npu)" stroke-width="1.8"/>
      <circle cx="12" cy="14" r="5" fill="url(#ai-npu)"/>
      <text x="12" y="17" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="7" text-anchor="middle">AI</text>
    </g>
    <!-- Neural Connections -->
    <circle cx="56" cy="42" r="2" fill="#38BDF8"/>
    <line x1="56" y1="42" x2="68" y2="45" stroke="#38BDF8" stroke-width="0.8" opacity="0.7"/>
    <circle cx="104" cy="42" r="2" fill="#A855F7"/>
    <line x1="92" y1="45" x2="104" y2="42" stroke="#A855F7" stroke-width="0.8" opacity="0.7"/>
    <circle cx="80" cy="70" r="2" fill="#06B6D4"/>
    <line x1="80" y1="66" x2="80" y2="70" stroke="#06B6D4" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Laptop Base -->
  <polygon points="18,102 142,102 130,80 30,80" fill="#1E1B4B"/>
  <polygon points="34,83 126,83 122,96 38,96" fill="#090D16"/>
  <!-- Front Edge AI LED Strip -->
  <line x1="30" y1="102" x2="130" y2="102" stroke="url(#ai-npu)" stroke-width="2" filter="url(#ai-glow)"/>
</svg>
