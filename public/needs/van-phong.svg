<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="vp-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#002050"/>
    </linearGradient>
    <linearGradient id="vp-body" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="vp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Laptop Base Shadow -->
  <ellipse cx="80" cy="108" rx="60" ry="7" fill="#CBD5E1" opacity="0.6"/>

  <!-- Laptop Screen Lid -->
  <g filter="url(#vp-shadow)">
    <!-- Screen Bezel -->
    <rect x="36" y="22" width="88" height="58" rx="4" fill="#1E293B"/>
    <!-- Screen Display -->
    <rect x="40" y="26" width="80" height="50" rx="2" fill="url(#vp-screen)"/>
    <!-- Windows Desktop Elements -->
    <rect x="45" y="32" width="28" height="18" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="47" y="35" width="24" height="3" fill="#0078D4"/>
    <rect x="47" y="40" width="16" height="2" fill="#94A3B8"/>
    <rect x="47" y="44" width="20" height="2" fill="#94A3B8"/>
    <!-- Chart on screen -->
    <rect x="80" y="38" width="5" height="12" rx="1" fill="#38BDF8"/>
    <rect x="87" y="34" width="5" height="16" rx="1" fill="#60A5FA"/>
    <rect x="94" y="30" width="5" height="20" rx="1" fill="#3B82F6"/>
    <rect x="101" y="28" width="5" height="22" rx="1" fill="#2563EB"/>
    <line x1="40" y1="72" x2="120" y2="72" stroke="#334155" stroke-width="3"/>
  </g>

  <!-- Floating Office App Badges -->
  <!-- Word -->
  <g transform="translate(18, 16)" filter="url(#vp-shadow)">
    <rect width="20" height="20" rx="4" fill="#2B579A"/>
    <text x="10" y="15" fill="#FFF" font-family="system-ui" font-weight="900" font-size="12" text-anchor="middle">W</text>
  </g>
  <!-- Excel -->
  <g transform="translate(26, 38)" filter="url(#vp-shadow)">
    <rect width="18" height="18" rx="4" fill="#217346"/>
    <text x="9" y="13" fill="#FFF" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">X</text>
  </g>
  <!-- PowerPoint -->
  <g transform="translate(122, 18)" filter="url(#vp-shadow)">
    <rect width="19" height="19" rx="4" fill="#D24726"/>
    <text x="9.5" y="14" fill="#FFF" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">P</text>
  </g>
  <!-- Cloud / Teams -->
  <g transform="translate(116, 42)" filter="url(#vp-shadow)">
    <rect width="18" height="18" rx="4" fill="#464EB8"/>
    <text x="9" y="13" fill="#FFF" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">T</text>
  </g>

  <!-- Laptop Base/Keyboard Deck -->
  <polygon points="18,102 142,102 130,80 30,80" fill="url(#vp-body)"/>
  <polygon points="34,83 126,83 123,97 37,97" fill="#64748B" opacity="0.3"/>
  <!-- Trackpad -->
  <rect x="68" y="99" width="24" height="2" rx="1" fill="#64748B"/>
  <rect x="20" y="102" width="120" height="3" rx="1.5" fill="#94A3B8"/>
</svg>
